# Проверка описания API. Два правила выключены, и оба — про устройство, а не про
# небрежность:
# - `operation-2xx-response`: успех живой комнаты — переход в вебсокет (101), а
#   правило знает только 2XX;
# - `operation-4xx-response`: у живого здоровья и у списка вопросов онбординга нет
#   ветки отказа клиента — отказ на них придумать можно, а предусмотреть нельзя.
extends:
  - recommended
rules:
  operation-2xx-response: off
  operation-4xx-response: off
